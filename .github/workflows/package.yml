name: Build and release Python package

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, packaging-python-wheel]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source archive
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify clean wheel installation
        run: |
          python -m venv .package-test
          .package-test/bin/python -m pip install --no-deps dist/*.whl
          .package-test/bin/sudarshan --help
          .package-test/bin/sudarshan benchmark list
          .package-test/bin/sudarshan benchmark run core --dry-run
          .package-test/bin/python -c "import sudarshan; from sudarshan import Harness; print('installed version:', sudarshan.__version__); print('Harness import: OK')"

      - name: Publish wheel and source archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Sudarshan $GITHUB_REF_NAME" \
            --generate-notes
